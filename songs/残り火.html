<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>残り火 - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">残り火</h1>

      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※コールブロックをクリックするとそのタイミングへスキップして再生できます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイトをご確認ください。
      </div>

      <div class="lyrics" id="call-list-container"></div>
    </div>
  </div>

  <script src="../player.js"></script>
  <script>
    initCallGuide({
      videoId: "HnK9kA2CdFw",
      calls: [
        { start: "0:00", end: "0:30", lyrics: "灰になった記憶", call: "うっおいうっおいうっおい\n👏 👏👏 👏 👏しゃー行くぞ\nタイガーファイヤーサイバーファイバーダイバーバイバージャージャー\n虎火人造繊維海女振動化繊\nチャペアペカラキナララトゥスケミョーホントゥスケ" },
        { start: "1:08", end: "1:13", lyrics: "残りの熱も全部君に渡す", call: "うっおいうっおいうっおいうっおいおーーおいおいおいおい" },
        { start: "1:27", end: "1:32", lyrics: "壊れる未来も全部選んでる", call: "うっおいうっおいうっおいうっおいおーーおいおいおいおい" },
        { start: "1:39", end: "2:01", lyrics: "君に預けたい求めたい not yours", call: "農場 舞 海鵜 跳 除去飛化繊振動海女繊維人造火 ！\n虎 ！火 ！虎 ！火 ！虎虎虎虎 虎火人造海女振動 ！\n海女振海女震海女振動！ \n海女繊維海女繊維人造火 ！\n虎火人造繊維 👏\n海女！振動！化繊！飛！除去！跳！海鵜！舞！農場！" },
        { start: "2:30", end: "2:34", lyrics: "存在の残量 全部君に渡す", call: "うっおいうっおいうっおいうっおいおーーおいおいおいおい" },
        { start: "2:42", end: "2:54", lyrics: "君に溺れたい呑まれたいI'm yours", call: "わ×6ワールドカオス 諸行 小暮 時雨 神楽 金剛山 翔襲叉" },
        { start: "2:54", end: "3:03", lyrics: "灰になった昨日を部屋に積もらせていく", call: "しょ×6翔襲叉 金剛山 神楽 時雨 小暮 諸行 ワールドカオス" },
        { start: "3:01", end: "3:22", lyrics: "炎強く燃える", call: "キタキタキタキタ 湧いてきた\nタイガー タイガー タイガーショット\n虎タイ 虎タイ虎タイガー\n人造繊維イエッタイガー\nジャッジャー ジャッジャーバリバリボー\nストスト ストストストライカー\nカール ハインツシュナイダー\nスカイ ラブハリケーン" },
        { start: "4:01", end: "4:21", lyrics: "君に溺れたい呑まれたい I'm yours", call: "銀河に轟く歌声と地球に花咲くその笑顔\nお前が好きだと輝き叫ぶ行くぜ全力どこまでも\n光の如く駆け巡る好きじゃねぇ愛してる\nインジョ ジャスパー ビブラル イェッナルダ ファボリアスター" }
      ]
    });
  </script>

<!-- タイル型カスタムプレイヤー -->
<div class="tile-player">
  
  <!-- 再生/停止 -->
  <button id="play-pause-btn" class="tile-item tile-btn" aria-label="再生/一時停止">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <!-- 現在時間表示 -->
  <div class="tile-item tile-time">
    <span id="current-time">0:00</span>
  </div>

  <!-- シークバー（横いっぱいに広がる） -->
  <div class="tile-item tile-seek">
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
  </div>

  <!-- 音量 -->
  <div class="tile-item tile-volume">
    <button id="mute-btn" class="tile-icon-btn" aria-label="ミュート切替">
      <svg id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <svg id="icon-muted" viewBox="0 0 24 24" class="hidden"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <input type="range" id="volume-bar" value="100" min="0" max="100">
  </div>

</div>

</body>
</html>
