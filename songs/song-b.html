<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全開☆ワンダーランド - コールガイド</title>
  <!-- style.cssは一つ上の階層にあるため ../style.css と指定します -->
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">全開☆ワンダーランド</h1>

      <!-- YouTube Music 埋め込み（iframe） -->
      <div class="media-container">
        <!-- srcのURL内の VIDEO_ID 部分を実際の動画・曲IDに置き換えます -->
        <iframe width="100%" height="180" src="https://music.youtube.com/embed/VIDEO_ID" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- コール表本文 -->
      <div class="lyrics">
（イントロ）
<span class="call">タイガー！ファイヤー！サイバー！ファイバー！</span>
<span class="call">ダイバー！バイバー！ジャージャー！</span>

走れ！未来へ（<span class="call">超絶可愛い！〇〇！</span>）
掴め！夢を（<span class="call">はい！はい！はいはいはいはい！</span>）
      </div>
    </div>
  </div>

</body>
</html>
