<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>僕とボク - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* 動画プレイヤーのレスポンシブ・サイズ調整設定 */
    .media-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }
    .media-container iframe {
      width: 100% !important;
      aspect-ratio: 16 / 9;
      height: auto !important;
      display: block;
      border: none;
    }

    /* ハイライト用のスタイル */
    .call-block {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      transition: background-color 0.3s, border-left 0.3s;
      border-left: 4px solid transparent;
      background-color: rgba(0, 0, 0, 0.02);
    }
    .call-block.active {
      background-color: #ffe6ed; /* ハイライト背景色 */
      border-left: 4px solid var(--primary-color, #ff4785);
    }
    .time-label {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      color: #888;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">僕とボク</h1>

      <!-- YouTube API プレーヤー表示エリア（サイズ指定用クラス .media-container を追加） -->
      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice" style="font-size: 0.8rem; color: #666; margin-bottom: 16px;">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイト（Google Search等）をご確認ください。
      </div>

      <!-- コール表（タイムスタンプ＆ハイライト連動） -->
      <div class="lyrics">

        <!-- イントロ1 -->
        <div class="call-block" data-start="7" data-end="13">
          <span class="time-label">0:07~</span>
          <span class="call">
            <br>ページ作成のテンプレ
            <br>ページ作成のテンプレ
          </span>
        </div>

      </div>
    </div>
  </div>

  <!-- YouTube IFrame Player API スクリプト -->
  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '315',
        width: '560',
        videoId: 'OSeDeV8EStQ', // ★対象の11桁の動画ID
        playerVars: { 
          'playsinline': 1,
          'rel': 0
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    var checkTimer = null;

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        checkTimer = setInterval(updateHighlight, 300);
      } else {
        clearInterval(checkTimer);
      }
    }

    function updateHighlight() {
      if (!player || !player.getCurrentTime) return;
      var currentTime = player.getCurrentTime();
      var blocks = document.querySelectorAll('.call-block');

      blocks.forEach(function(block) {
        var start = parseFloat(block.getAttribute('data-start'));
        var end = parseFloat(block.getAttribute('data-end'));

        if (currentTime >= start && currentTime < end) {
          block.classList.add('active');
        } else {
          block.classList.remove('active');
        }
      });
    }
  </script>

</body>
</html>
