<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パラドクスナイト - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<div class="card">
  <h1 class="song-title">ハグバグ</h1>

  <!-- YouTube 埋め込みプレイヤー（API制御用に id="player" を付与） -->
  <div style="width: 100%; max-width: 560px; margin: 0 auto 20px auto; border-radius: 12px; overflow: hidden;">
    <div id="player"></div>
  </div>

  <!-- タイムスタンプ付きコール表 -->
  <div class="lyrics">
    <div class="call-block" data-start="0" data-end="10">
      <span class="time-label">0:00~</span>
      <span class="call">（ミョーホントゥスケ化繊飛除去ジャージャファイボワイパー）</span>
    </div>

    <div class="call-block" data-start="65" data-end="75">
      <span class="time-label">1:05~</span> 【1番サビ前】<br>
      〜〜朝まで目が覚めるまで<br>
      <span class="call">（ひまりコール：ひまり×4）</span>
    </div>

    <div class="call-block" data-start="80" data-end="95">
      <span class="time-label">1:20~</span> 【1番サビ】<br>
      〜〜そんくらいが <span class="call">（はいせーのはいせーの）</span><br>
      〜〜ちょうどいいかもね <span class="call">（おーいおいおいおいおいおい）</span>
    </div>
  </div>
</div>

<!-- スタイル（ハイライト表示用） -->
<style>
  .call-block {
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    transition: background-color 0.3s, border-left 0.3s;
    border-left: 4px solid transparent;
  }
  /* 再生中のハイライトCSS */
  .call-block.active {
    background-color: #ffe6ed; /* 薄いピンク背景 */
    border-left: 4px solid var(--primary-color, #ff4785);
    font-weight: bold;
  }
  .time-label {
    font-size: 0.8rem;
    color: #888;
    margin-right: 6px;
  }
</style>

<!-- YouTube IFrame Player API の制御スクリプト -->
<script>
  // 1. YouTube APIの読み込み
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '315',
      width: '560',
      videoId: '4pcqsORvThE', // ★対象の動画IDに差し替えてください
      playerVars: { 'playsinline': 1 },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  }

  var checkTimer = null;

  // 再生状態に合わせてタイマーを制御
  function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.PLAYING) {
      // 0.5秒ごとに再生時間をチェック
      checkTimer = setInterval(updateHighlight, 500);
    } else {
      clearInterval(checkTimer);
    }
  }

  // 再生時間に応じてハイライトを切り替える関数
  function updateHighlight() {
    if (!player || !player.getCurrentTime) return;
    var currentTime = player.getCurrentTime();
    var blocks = document.querySelectorAll('.call-block');

    blocks.forEach(function(block) {
      var start = parseFloat(block.getAttribute('data-start'));
      var end = parseFloat(block.getAttribute('data-end'));

      if (currentTime >= start && currentTime < end) {
        block.classList.add('active');
      } else {
        block.classList.remove('active');
      }
    });
  }
</script>
</html>
