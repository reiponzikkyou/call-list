<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規楽曲 - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">新規楽曲</h1>

      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※コールブロックをクリックするとそのタイミングへスキップして再生できます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイトをご確認ください。
      </div>

      <div class="lyrics" id="call-list-container"></div>
    </div>
  </div>

  <script src="../player.js"></script>
  <script>
    initCallGuide({
      videoId: "4pcqsORvThE",
      calls: [
        { start: "0:07", end: "0:14", call: "はいせーの\nミョーホントゥスケ化繊飛除去ジャージャファイボワイパー" },
        { start: "0:16", end: "0:24", call: "うっおいうっおいうっおいうっおい👏 👏👏 👏 👏しゃーいくぞタイガーファイヤーサイバーファイバーダイバーバイバージャージャー" },
        { start: "0:24", end: "0:30", lyrics: "汚されていく", call: "あ！あ！あー(名前)！" },
        { start: "0:32", end: "0:35", lyrics: "モヤモヤモヤる世界", call: "おーれーの！(名前)！" },
        { start: "0:45", end: "0:50", lyrics: "HateMySelf  生きて生きてたどり着いた", call: "りりな×4" },
        { start: "0:50", end: "0:53", lyrics: "LoveMySelf 今夜も", call: "まりあ×2" },
        { start: "1:01", end: "1:06", lyrics: "天使と悪魔がまた手を繋いでる", call: "はいせーのはいせーのおーいおいおいおいおい" },
        { start: "1:16", end: "1:27", call: "うっおいうっおいうっおいうっおい👏 👏👏 👏 👏しゃーいくぞ虎火人造繊維海女振動化繊" },
        { start: "1:27", end: "1:43", lyrics: "ハテナを置いてった", call: "あ！あ！あー(名前)！" },
        { start: "1:45", end: "1:48", lyrics: "ゆらゆらゆらゆら 今夜も", call: "優来ちゃん指差しゆらゆらコール" },
        { start: "1:53", end: "1:59", lyrics: "天使と悪魔がまだ手を繋いでる", call: "はいせーのはいせーのおーいおいおいおい" },
        { start: "2:10", end: "2:31", call: "言いたいことがあるんだよ！\nやっぱり(名前)可愛いよ！\n好き好き大好きやっぱ好き！\nやっと見つけたお姫様！\n俺が生まれて来た理由！\nそれは(名前)に出会うため！\n俺と一緒に人生歩もう世界で1番愛してる！" },
        { start: "2:47", end: "2:53", lyrics: "天使と悪魔がまた手を繋いでる", call: "はいせーのはいせーのおーいおいおいおい" },
        { start: "3:03", end: "3:18", call: "世界で1番愛してやまない(名前)に捧げるチャペ虎タイガー チャペ×8 I Love You (絶対結婚しような！)" }
      ]
    });
  </script>
<br>
<br>
<br>

<!-- タイル型カスタムプレイヤー -->
<div class="tile-player">
  
  <!-- 再生/停止 -->
  <button id="play-pause-btn" class="tile-item tile-btn" aria-label="再生/一時停止">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <!-- 現在時間表示 -->
  <div class="tile-item tile-time">
    <span id="current-time">0:00</span>
  </div>

  <!-- シークバー（横いっぱいに広がる） -->
  <div class="tile-item tile-seek">
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
  </div>

  <!-- 音量 -->
  <div class="tile-item tile-volume">
    <button id="mute-btn" class="tile-icon-btn" aria-label="ミュート切替">
      <svg id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <svg id="icon-muted" viewBox="0 0 24 24" class="hidden"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <input type="range" id="volume-bar" value="100" min="0" max="100">
  </div>

</div>

</body>
</html>
