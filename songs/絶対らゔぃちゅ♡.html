<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>絶対らゔぃちゅ♡ - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">絶対らゔぃちゅ♡</h1>

      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※コールブロックをクリックするとそのタイミングへスキップして再生できます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイトをご確認ください。
      </div>

      <div class="lyrics" id="call-list-container"></div>
    </div>
  </div>

  <script src="../player.js"></script>
  <script>
    initCallGuide({
      videoId: "mVZcGanH3Ak",
      calls: [
        { start: "0:05", end: "0:15", call: "うっおいうっおいうっおい\n👏 👏👏 👏 👏しゃー行くぞ\nタイガーファイヤーサイバーファイバーダイバーバイバージャージャー" },
        { start: "0:31", end: "0:36", lyrics: "恋は甘くて熱くなるものでしょ", call: "（名前）×4" },
        { start: "1:02", end: "1:13", call: "うっおいうっおいうっおい\n👏 👏👏 👏 👏しゃー行くぞ\n虎火人造繊維海女振動化繊" },
        { start: "1:13", end: "1:34", lyrics: "愛は深くて尊いものでしょ？", call: "（名前）×4" },
        { start: "2:31", end: "2:42", call: "うっおいうっおいうっおい\n👏 👏👏 👏 👏しゃー行くぞ\nチャペアペカラキナララトゥスケミョーホントゥスケ" }
      ]
    });
  </script>
  <br>
<br>
<br>

<!-- タイル型カスタムプレイヤー --><!-- タイル型カスタムプレイヤー -->
<div class="tile-player">

  <!-- 現在時間表示 -->
  <div class="tile-item tile-time">
    <span id="current-time">0:00</span>
  </div>

  <!-- シークバー（横いっぱいに広がる） -->
  <div class="tile-item tile-seek">
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
  </div>

    <!-- 再生/停止 -->
  <button id="play-pause-btn" class="tile-item tile-btn" aria-label="再生/一時停止">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

</body>
</html>
