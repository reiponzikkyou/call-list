<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacrifice - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">Sacrifice</h1>

      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※コールブロックをクリックするとそのタイミングへスキップして再生できます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイトをご確認ください。
      </div>

      <div class="lyrics" id="call-list-container"></div>
    </div>
  </div>

  <script src="../player.js"></script>
  <script>
    initCallGuide({
      videoId: "ビデオIDいれてL-VMYQ1v-vM",
      calls: [
        { start: "0", end: "10", lyrics: "イントロ", call: "タイガーファイヤー\nタイガーファイヤ―サイバーファイバーダイバーじゃーじゃー\nファイボー 👏 ワイパー" },
        { start: "10", end: "20", lyrics: "Aメロ", call: "あ！あ！あー（名前）\nおーれーの！（名前）" },
        { start: "20", end: "30", lyrics: "Bメロ", call: "（名前）×4\n（名前）×2" },
        { start: "30", end: "40", lyrics: "サビ", call: "はいせーの はいせーの\nおーいおい おいおいおいおい" },
        { start: "40", end: "50", lyrics: "間奏（1→2）", call: "うっおいうっおいうっおい👏 👏👏 👏 👏しゃー行くぞ虎火人造繊維海女振動化繊)" },
        { start: "50", end: "60", lyrics: "2番サビ後", call: "俺とお前の赤い糸\nおーれのっ　俺のっ　(名前)\nいやいやいやいやいやいやいやいや\nおーれーのっ　(名前)" },
        { start: "60", end: "70", lyrics: "Cメロ", call: "（名前）×4\n（名前）×2" },
        { start: "70", end: "80", lyrics: "ラスサビ前", call: "イェイェイェッタイガー" },
        { start: "80", end: "90", lyrics: "ラスサビ", call: "はいせーの はいせーの\nおーいおい おいおいおいおい" },
        { start: "90", end: "100", lyrics: "アウトロ", call: "良さげなの誰か入れて下さい。\n曲調はゴシック？ダークメルヘン？ぽい感じ、歌詞はテーマの一つにお星さまがあるっぽい。\nちょいはみ出して12小節もありかも。\n多分10小節？\n参考に10小節のコール\n[阿修羅混沌mix]\n(ワ×2～)ワールドカオス\n諸行(しょぎょう)木暮(こぐれ)\n時雨(しぐれ)神楽(かぐら)\n金剛山(こんごうさん)翔襲叉(しょうしゅうしゃ)\n極運(ごくうん)夢境(むきょう)\n冥界(めいかい)強剛(ごうきょう)\nナウダ　マモリアスター" }
      ]
    });
  </script>
  <br>
<br>
<br>

<!-- タイル型カスタムプレイヤー -->
<!-- タイル型カスタムプレイヤー -->
<div class="tile-player">

  <!-- 現在時間表示 -->
  <div class="tile-item tile-time">
    <span id="current-time">0:00</span>
  </div>

  <!-- シークバー（横いっぱいに広がる） -->
  <div class="tile-item tile-seek">
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
  </div>

    <!-- 再生/停止 -->
  <button id="play-pause-btn" class="tile-item tile-btn" aria-label="再生/一時停止">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

</div>
</body>
</html>
