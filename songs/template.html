<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ★【ステップ1】曲名を設定してください -->
  <title>【曲名】 - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <!-- ★【ステップ1】曲名を設定してください -->
      <h1 class="song-title">【曲名】</h1>

      <!-- YouTube プレーヤー表示エリア -->
      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※コールブロックをクリックするとそのタイミングへスキップして再生できます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイトをご確認ください。
      </div>

      <!-- コール表表示エリア（player.jsで自動生成） -->
      <div class="lyrics" id="call-list-container"></div>
    </div>
  </div>

  <!-- 共通スクリプト（変更不要） -->
  <script src="../player.js"></script>

  <!-- ★【ステップ2 & 3】動画IDとコールデータを設定してください -->
  <script>
    initCallGuide({
      // ★【ステップ2】YouTube動画の11桁ID（例: https://www.youtube.com/watch?v=XXXXX の XXXXX 部分）
      videoId: '動画IDを入力',

      // ★【ステップ3】コール一覧を辞書形式で記述
      calls: [
        /* ==========================================================================
         * 【書き方ガイド】
         * - start  : [必須] コール開始時間 ("0:07" や "1:23" などの分:秒、または秒数 7, 83)
         * - end    : [必須] コール終了時間 ("0:13" や "1:35" などの分:秒、または秒数 13, 95)
         * - lyrics : [任意] 歌詞テキスト（歌詞がない間奏コール等の場合は省略OK）
         * - call   : [必須] コール内容（改行は \n または 配列 ["1行目", "2行目"] が使えます）
         * - time   : [任意] 表示用時間ラベル（省略時は start から "0:07~" のように自動生成）
         * ========================================================================== */

        // パターン1: 通常のコール（歌詞＋コール）
        {
          start: "0:07",
          end: "0:13",
          lyrics: "歌詞テキストを入力",
          call: "あー〇〇ちゃん"
        },

        // パターン2: 複数行のコール
        {
          start: "0:14",
          end: "0:24",
          lyrics: "歌詞テキスト2行目",
          call: "うっおいうっおいうっおいうっおい\nタイガーファイヤーサイバーファイバー"
        },

        // パターン3: 間奏・イントロコール（歌詞なし）
        {
          start: "0:25",
          end: "0:35",
          call: "虎火人造繊維海女振動化繊飛除去"
        }

        // 必要な分だけ上に続けて { ... }, を追加してください
      ]
    });
  </script>

</body>
</html>
