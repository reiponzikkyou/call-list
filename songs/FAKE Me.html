<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAKE Me - コールガイド</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <a href="../index.html">← トップへ戻る</a>
  </header>

  <div class="container">
    <a href="../index.html" class="back-btn">← 楽曲一覧に戻る</a>

    <div class="card">
      <h1 class="song-title">FAKE Me</h1>

      <div class="media-container">
        <div id="player"></div>
      </div>

      <div class="notice">
        ※再生に合わせてコールのタイミングが自動でハイライトされます。<br>
        ※コールブロックをクリックするとそのタイミングへスキップして再生できます。<br>
        ※歌詞の全文や正確なフレーズは各種公式音源・歌詞検索サイトをご確認ください。
      </div>

      <div class="lyrics" id="call-list-container"></div>
    </div>
  </div>

  <script src="../player.js"></script>
  <script>
    initCallGuide({
      videoId: "eMnJjY87FaI",
      calls: [
        { start: "0:04", end: "0:10", call: "出発進行！\nトーマスゴードンヘンリーパーシードビーエドワードぽっぽー" },
        { start: "0:10", end: "0:20", call: "うっおいうっおいうっおいうっおい\n👏 👏👏 👏 👏しゃーいくぞ\nタイガーファイヤーサイバーファイバーダイバーバイバージャージャー" },
        { start: "0:23", end: "0:25", lyrics: "飲み込んであげたい", call: "あ！あ！あー！(名前)" },
        { start: "0:28", end: "0:30", lyrics: "姫を縛ってさあどうする気だよ？", call: "おーれーの！(名前)" },
        { start: "0:30", end: "0:40", call: "ライオン トラ チーター ラタラタ ラトラーター \nサイ ゴリラ ゾウ \nサゴーゾーサゴーゾー" },
        { start: "0:43", end: "0:45", lyrics: "「わたし弱いよすぐ壊れちゃうよ」", call: "あ！あ！あー！(名前)" },
        { start: "0:48", end: "0:50", lyrics: "「きゅる」だからって舐めんなよ", call: "あっあっあー(名前)" },
        { start: "0:55", end: "1:00", lyrics: "光も闇も消えて無くなれ", call: "アイアイ×4" },
        { start: "1:00", end: "1:05", lyrics: "No-me Know-me Q  溶けたい  No-me Know-me Q  ほどけたい", call: "アンコール！アンコール！アンコール！アンコール！" },
        { start: "1:05", end: "1:10", lyrics: "ほどけたい  光も闇も愛してくれる？", call: "アイアイ×4" },
        { start: "1:11", end: "1:21", call: "うっおいうっおいうっおいうっおい\n👏 👏👏 👏 👏しゃーいくぞ\n虎火人造繊維海女振動化繊" },
        { start: "1:23", end: "1:26", lyrics: "きみがオレをみつけたんだろ？", call: "あ！あ！あー！(名前)" },
        { start: "1:28", end: "1:31", lyrics: "ぴょんぴょん寂しい一人は「いやだ」", call: "おーれーの！(名前)" },
        { start: "1:33", end: "1:36", lyrics: "甘い甘い愛情で「ちゅくして」", call: "あ！あ！あー！(名前)" },
        { start: "1:38", end: "1:41", lyrics: "きゅるきゅる虜になってんな？", call: "おーれーの！(名前)" },
        { start: "1:56", end: "2:01", lyrics: "光も闇も壊してやりたい 間違い探しはできない", call: "アイアイ×4" },
        { start: "2:01", end: "2:06", lyrics: "No-me Know-me Q  溶かして  No-me Know-me Q  ほどいて", call: "アンコール×4" },
        { start: "2:06", end: "2:11", lyrics: "光と闇すらもうわかんない", call: "アイアイ×4" },
        { start: "2:11", end: "2:21", call: "ウィースペケスイ チャペチャペチャペ チャペアペカラ キナ \nカラアペチャペ \n除去飛除去 虎虎虎虎火人造繊維海女振動化繊\n(ぐるぐるぐるぐる (名前)落ちサビ頑張って)" },
        { start: "2:53", end: "3:03", call: "ファイボワイパー ワワワワワイパー\nファーマジャスパー ジャジャジャジャジャスパー  \nホワイパクーパー クククククーパー \nイェスクレイパー イェイェスクレイパー" }
      ]
    });
  </script>
  <br>
<br>
<br>

<!-- タイル型カスタムプレイヤー -->
<div class="tile-player">
  
  <!-- 再生/停止 -->
  <button id="play-pause-btn" class="tile-item tile-btn" aria-label="再生/一時停止">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <!-- 現在時間表示 -->
  <div class="tile-item tile-time">
    <span id="current-time">0:00</span>
  </div>

  <!-- シークバー（横いっぱいに広がる） -->
  <div class="tile-item tile-seek">
    <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
  </div>

  <!-- 音量 -->
  <div class="tile-item tile-volume">
    <button id="mute-btn" class="tile-icon-btn" aria-label="ミュート切替">
      <svg id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <svg id="icon-muted" viewBox="0 0 24 24" class="hidden"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <input type="range" id="volume-bar" value="100" min="0" max="100">
  </div>
</body>
</html>
